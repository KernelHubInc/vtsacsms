name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Laravel platform
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: vtsa_test
          POSTGRES_USER: vtsa
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vtsa -d vtsa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pdo_pgsql, redis, zip
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('apps/platform/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate --force
      - run: composer audit
      - run: composer lint
      - run: composer test
      - name: Verify PostgreSQL migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: vtsa_test
          DB_USERNAME: vtsa
        run: php artisan migrate:fresh --force && php artisan migrate:status
      - run: npm ci
      - run: npm run build

  mobile:
    name: Flutter mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Enable KVM for Android integration tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .
      - name: Run Android integration journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/mobile
          script: flutter test integration_test
      - run: flutter build apk --debug --dart-define-from-file=dart_defines.example.json

  gateway:
    name: OCPP gateway
    runs-on: ubuntu-latest
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: services/ocpp-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ocpp-gateway/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src tests
      - run: python -m pytest
      - run: python -m pip_audit

  contracts:
    name: Shared contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run generate
      - name: Verify generated artifacts are current
        working-directory: .
        run: git diff --exit-code -- packages/contracts/generated

  kyc:
    name: KYC processing and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/kyc-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/kyc-service/requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements.lock && pip install -e '.[dev]'
      - run: ruff format --check app tests scripts migrations
      - run: ruff check app tests scripts migrations
      - run: mypy app
      - run: pytest -q
      - name: Verify pinned self-hosted face model loading
        run: |
          python scripts/install_face_models.py "$RUNNER_TEMP/kyc-models"
          python scripts/check_face_models.py "$RUNNER_TEMP/kyc-models"
          python scripts/install_liveness_model.py "$RUNNER_TEMP/kyc-models"
          python scripts/check_liveness_model.py "$RUNNER_TEMP/kyc-models"
      - run: pip-audit -r requirements.lock
      - run: python scripts/export_openapi.py
      - run: git diff --exit-code -- ../../packages/contracts/openapi/kyc.internal.v1.json
      - run: docker build --target test -t vtsa-kyc-test . && docker run --rm vtsa-kyc-test
      - name: Exercise real KYC gateway, worker, callback and manual review
        run: |
          python scripts/setup_local.py
          python scripts/prepare_integration.py
          docker compose -p vtsa-kyc-integration --env-file .env -f docker-compose.yml -f docker-compose.integration.yml up -d --build kyc-platform kyc-worker kyc-beat
          docker compose -p vtsa-kyc-integration --env-file .env -f docker-compose.yml -f docker-compose.integration.yml exec -T kyc-platform php artisan migrate --force
          docker compose -p vtsa-kyc-integration --env-file .env -f docker-compose.yml -f docker-compose.integration.yml exec -T kyc-platform php tests/kyc-smoke.php seed
          python scripts/integration_smoke.py
      - name: Stop isolated KYC integration services
        if: always()
        run: docker compose -p vtsa-kyc-integration --env-file .env -f docker-compose.yml -f docker-compose.integration.yml down --remove-orphans

  containers:
    name: Container images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: apps/platform
            image: vtsa-platform
          - context: services/ocpp-gateway
            image: vtsa-ocpp-gateway
          - context: services/kyc-service
            image: vtsa-kyc
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deployment_configuration:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: Install shell validator
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Validate deployment scripts
        run: |
          shellcheck scripts/deploy-app-node.sh scripts/deploy-kyc.sh scripts/kyc-staging.sh scripts/load-balancer-node.sh scripts/prepare-data-server.sh infra/cluster/data/postgres/10-create-vtsa-databases.sh
          bash -n scripts/deploy-app-node.sh scripts/deploy-kyc.sh scripts/kyc-staging.sh scripts/load-balancer-node.sh scripts/prepare-data-server.sh infra/cluster/data/postgres/10-create-vtsa-databases.sh
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: Validate staging, production, and data Compose projects
        run: |
          docker compose --env-file .env.app.staging.example -f infra/cluster/compose.app.yaml config --quiet
          docker compose --env-file .env.app.production.example -f infra/cluster/compose.app.yaml config --quiet
          DATA_BIND_ADDRESS=127.0.0.1 docker compose --env-file .env.data.example -f infra/cluster/compose.data.yaml config --quiet
      - name: Validate private KYC deployment isolation
        run: sudo python3 -m unittest discover -s tests/infra -p 'test_kyc*.py'

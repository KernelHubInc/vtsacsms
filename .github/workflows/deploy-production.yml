name: Deploy production app nodes

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  publish:
    name: Publish ${{ matrix.image }} image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: platform
            context: apps/platform
            target: runtime
          - image: web
            context: apps/platform
            target: web
          - image: ocpp-gateway
            context: services/ocpp-gateway
            target: runtime
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/kernelhubinc/vtsacsms/${{ matrix.image }}:sha-${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=production-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=production-${{ matrix.image }}

  deploy:
    name: Rolling deploy
    needs: publish
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Configure deployment SSH key
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy App Server 1 and migrate
        env:
          DEPLOY_USER: ${{ vars.PRODUCTION_DEPLOY_USER }}
          LOAD_BALANCER_HOST: ${{ vars.LOAD_BALANCER_HOST }}
          APP_HOST: ${{ vars.APP_NODE_1_HOST }}
        run: >-
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes
          -J "$DEPLOY_USER@$LOAD_BALANCER_HOST"
          "$DEPLOY_USER@$APP_HOST"
          "sudo /usr/local/sbin/vtsa-deploy-app 'sha-$RELEASE_SHA' --migrate"

      - name: Deploy App Server 2
        env:
          DEPLOY_USER: ${{ vars.PRODUCTION_DEPLOY_USER }}
          LOAD_BALANCER_HOST: ${{ vars.LOAD_BALANCER_HOST }}
          APP_HOST: ${{ vars.APP_NODE_2_HOST }}
        run: >-
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes
          -J "$DEPLOY_USER@$LOAD_BALANCER_HOST"
          "$DEPLOY_USER@$APP_HOST"
          "sudo /usr/local/sbin/vtsa-deploy-app 'sha-$RELEASE_SHA'"

      - name: Verify load-balanced production endpoint
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: curl --fail --show-error --silent --retry 12 --retry-all-errors --retry-delay 5 "$PRODUCTION_URL/health/ready"

name: Publish release images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, test_env]

permissions:
  contents: read

concurrency:
  group: staging-production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  publish:
    name: Publish ${{ matrix.image }} image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: platform
            context: apps/platform
            target: runtime
          - image: web
            context: apps/platform
            target: web
          - image: ocpp-gateway
            context: services/ocpp-gateway
            target: runtime
          - image: kyc
            context: services/kyc-service
            target: runtime
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/kernelhubinc/vtsacsms/${{ matrix.image }}:sha-${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

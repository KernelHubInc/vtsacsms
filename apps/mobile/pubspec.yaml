name: vtsa_mobile
description: "Power Solutions consumer mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  dio: ^5.9.1
  flutter_map: ^8.3.1
  flutter_map_marker_cluster: ^8.2.2
  flutter_secure_storage: ^10.0.0
  geolocator: ^14.0.3
  go_router: ^17.1.0
  google_maps_flutter: ^2.18.0
  intl: ^0.20.2
  latlong2: ^0.9.1
  mobile_scanner: ^7.4.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

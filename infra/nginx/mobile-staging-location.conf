# Include inside the staging.evcspowersolutions.com TLS server block.
# The Flutter build must use --base-href /mobile/ and the staging API origin.
location = /mobile {
    return 308 /mobile/$is_args$args;
}

location ^~ /mobile/ {
    alias /var/www/staging-mobile/current/;
    try_files $uri $uri/ /mobile/index.html;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

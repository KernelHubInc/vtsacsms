<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Find compatible EV chargers and follow charging sessions with Power Solutions.">
  <meta name="theme-color" content="#12366B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Power Solutions</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <style>
    html, body {
      background: #f5f8fb;
      height: 100%;
      margin: 0;
    }

    .startup {
      align-items: center;
      background:
        radial-gradient(circle at 88% 12%, rgba(87, 221, 210, .28), transparent 32%),
        linear-gradient(145deg, #f5f8fb 0%, #eaf8f8 100%);
      color: #17243a;
      display: flex;
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      inset: 0;
      justify-content: center;
      padding: 32px;
      position: fixed;
    }

    .startup__content {
      max-width: 420px;
      text-align: center;
      width: 100%;
    }

    .startup__logo {
      align-items: center;
      display: flex;
      justify-content: center;
      margin: 0 auto 30px;
      width: min(280px, 76vw);
    }

    .startup__logo img {
      display: block;
      height: auto;
      width: 100%;
    }

    .startup h1 {
      font-size: 32px;
      letter-spacing: -0.035em;
      line-height: 1.1;
      margin: 0 0 10px;
    }

    .startup p {
      color: #66758a;
      margin: 0 0 26px;
    }

    .startup__bar {
      background: #d8e4ed;
      border-radius: 999px;
      height: 4px;
      overflow: hidden;
    }

    .startup::before,
    .startup::after {
      border: 8px solid rgba(69, 207, 199, .22);
      border-radius: 999px;
      content: "";
      height: 42vw;
      max-height: 280px;
      max-width: 620px;
      pointer-events: none;
      position: absolute;
      transform: rotate(-17deg);
      width: 88vw;
    }

    .startup::before {
      bottom: -18%;
      left: -18%;
    }

    .startup::after {
      border-color: rgba(37, 137, 190, .12);
      right: -28%;
      top: -18%;
    }

    .startup__bar::after {
      animation: startup-progress 1.2s ease-in-out infinite;
      background: #45cfc7;
      border-radius: inherit;
      content: "";
      display: block;
      height: 100%;
      width: 42%;
    }

    .install-offer[hidden], .install-offer button[hidden] { display: none; }
    .install-offer {
      position: fixed;
      z-index: 10000;
      right: 18px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      box-sizing: border-box;
      width: min(370px, calc(100vw - 36px));
      padding: 18px 18px 18px 76px;
      border: 1px solid #c9e5e6;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 46px rgba(7, 27, 55, .22);
      color: #17243a;
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .install-offer__icon {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 44px;
      height: 44px;
      border-radius: 11px;
    }
    .install-offer__title { display: block; padding-right: 22px; font-size: 16px; line-height: 1.25; }
    .install-offer__detail { margin: 6px 0 12px; color: #52647b; }
    .install-offer__action {
      min-height: 40px;
      padding: 9px 16px;
      border: 0;
      border-radius: 10px;
      background: #12366b;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }
    .install-offer__action:hover { background: #18508f; }
    .install-offer__action:focus-visible, .install-offer__close:focus-visible {
      outline: 3px solid #45cfc7;
      outline-offset: 3px;
    }
    .install-offer__close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #52647b;
      cursor: pointer;
      font: 22px/1 system-ui, sans-serif;
    }
    @media (max-width: 600px) {
      .install-offer {
        top: calc(14px + env(safe-area-inset-top));
        right: 14px;
        bottom: auto;
        left: 14px;
        width: auto;
      }
    }

    @keyframes startup-progress {
      from { transform: translateX(-110%); }
      to { transform: translateX(350%); }
    }

    @media (prefers-color-scheme: dark) {
      html, body { background: #07172c; }
      .startup {
        background:
          radial-gradient(circle at 88% 12%, rgba(87, 221, 210, .14), transparent 32%),
          linear-gradient(145deg, #07172c 0%, #0b2448 100%);
        color: #f5fbff;
      }
      .startup p { color: #b9cfdd; }
      .startup__bar { background: #27496f; }
    }
  </style>
</head>
<body>
  <noscript>JavaScript is required to use Power Solutions.</noscript>
  <div class="startup" id="flutter-startup" role="status" aria-live="polite">
    <div class="startup__content">
      <div class="startup__logo" aria-hidden="true"><img src="assets/assets/branding/power-solutions-logo-horizontal.png" alt=""></div>
      <h1>Starting Power Solutions</h1>
      <p id="flutter-startup-detail">Preparing the mobile experience.</p>
      <div class="startup__bar" aria-hidden="true"></div>
    </div>
  </div>
  <aside id="install-offer" class="install-offer" aria-label="Install Power Solutions" hidden>
    <img class="install-offer__icon" src="icons/Icon-192.png" alt="">
    <strong class="install-offer__title">Power Solutions on your home screen</strong>
    <p id="install-offer-detail" class="install-offer__detail"></p>
    <button id="install-offer-action" class="install-offer__action" type="button">Install app</button>
    <button id="install-offer-close" class="install-offer__close" type="button" aria-label="Dismiss install suggestion">&times;</button>
  </aside>
  <script src="install-prompt.js"></script>
  <script>
    (() => {
      const startup = document.getElementById('flutter-startup');
      const detail = document.getElementById('flutter-startup-detail');
      const removeStartup = () => startup?.remove();
      const observer = new MutationObserver(() => {
        if (document.querySelector('flutter-view')) {
          observer.disconnect();
          removeStartup();
        }
      });

      observer.observe(document.body, { childList: true });
      window.addEventListener('flutter-first-frame', removeStartup, { once: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

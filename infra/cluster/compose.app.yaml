name: ${COMPOSE_PROJECT_NAME:-vtsa-csms-app}

x-logging: &json-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-platform-environment: &platform-environment
  APP_NAME: VTSA CSMS
  APP_ENV: ${DEPLOY_ENVIRONMENT:-production}
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_DEBUG: "false"
  APP_URL: ${APP_SCHEME:-https}://${APP_DOMAIN:?APP_DOMAIN is required}
  ASSET_URL: ${APP_SCHEME:-https}://${APP_DOMAIN:?APP_DOMAIN is required}
  TRUSTED_PROXIES: "*"
  LOG_CHANNEL: stderr-json
  LOG_LEVEL: info
  DB_CONNECTION: pgsql
  DB_HOST: ${DB_HOST:?DB_HOST is required}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_SSLMODE: ${DB_SSLMODE:-require}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
  SESSION_SAME_SITE: lax
  SESSION_COOKIE: ${SESSION_COOKIE:?SESSION_COOKIE is required}
  REDIS_CLIENT: phpredis
  REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  REDIS_DB: ${REDIS_DB:?REDIS_DB is required}
  REDIS_CACHE_DB: ${REDIS_CACHE_DB:?REDIS_CACHE_DB is required}
  REDIS_PREFIX: ${REDIS_PREFIX:?REDIS_PREFIX is required}
  OCPP_GATEWAY_REDIS_URL: ${GATEWAY_REDIS_URL:?GATEWAY_REDIS_URL is required}
  OCPP_GATEWAY_REDIS_DB: ${OCPP_GATEWAY_REDIS_DB:?OCPP_GATEWAY_REDIS_DB is required}
  MAIL_MAILER: smtp
  MAIL_SCHEME: ${MAIL_SCHEME:?MAIL_SCHEME is required}
  MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is required}
  MAIL_PORT: ${MAIL_PORT:?MAIL_PORT is required}
  MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
  MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS is required}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-VTSA CSMS}
  FILESYSTEM_DISK: s3
  AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
  AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
  AWS_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT is required}
  AWS_URL: ${MINIO_PUBLIC_URL:?MINIO_PUBLIC_URL is required}
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  MAP_PROVIDER_DEFAULT: ${MAP_PROVIDER_DEFAULT:-openstreetmap}
  MAP_PROVIDER_ADMIN: ${MAP_PROVIDER_ADMIN:-openstreetmap}
  MAP_PROVIDER_OPERATOR: ${MAP_PROVIDER_OPERATOR:-openstreetmap}
  MAP_PROVIDER_USER_WEB: ${MAP_PROVIDER_USER_WEB:-openstreetmap}
  MAP_PROVIDER_PUBLIC: ${MAP_PROVIDER_PUBLIC:-openstreetmap}
  MAP_DEFAULT_LATITUDE: ${MAP_DEFAULT_LATITUDE:-14.5995}
  MAP_DEFAULT_LONGITUDE: ${MAP_DEFAULT_LONGITUDE:-120.9842}
  MAP_DEFAULT_ZOOM: ${MAP_DEFAULT_ZOOM:-11}
  MAP_TILE_URL_TEMPLATE: ${MAP_TILE_URL_TEMPLATE:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
  MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-© OpenStreetMap contributors}
  GOOGLE_MAPS_BROWSER_API_KEY: ${GOOGLE_MAPS_BROWSER_API_KEY:-}
  GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
  FEATURE_OCPP: ${FEATURE_OCPP:-false}
  FEATURE_REMOTE_CHARGING: ${FEATURE_REMOTE_CHARGING:-false}
  FEATURE_REAL_PAYMENTS: ${FEATURE_REAL_PAYMENTS:-false}
  FEATURE_SETTLEMENTS: ${FEATURE_SETTLEMENTS:-false}
  FEATURE_OCPI: ${FEATURE_OCPI:-false}
  FEATURE_STORE_LOCATOR: ${FEATURE_STORE_LOCATOR:-true}
  FEATURE_INVENTORY: ${FEATURE_INVENTORY:-true}
  FEATURE_MAINTENANCE: ${FEATURE_MAINTENANCE:-true}
  FEATURE_PROCUREMENT: ${FEATURE_PROCUREMENT:-true}
  FEATURE_DEMO_MODE: "false"
  FEATURE_SIMULATED_CHARGING: "false"
  FEATURE_SIMULATED_PAYMENTS: "false"
  OCPP_GATEWAY_INTERNAL_URL: http://ocpp-gateway:9000
  OCPP_GATEWAY_INTERNAL_TOKEN: ${GATEWAY_INTERNAL_API_TOKEN:?GATEWAY_INTERNAL_API_TOKEN is required}
  OCPP_GATEWAY_REDIS_KEY_PREFIX: ${GATEWAY_REDIS_KEY_PREFIX:-vtsa:production:ocpp}
  OCPP_GATEWAY_EVENT_STREAM: ${GATEWAY_REDIS_KEY_PREFIX:-vtsa:production:ocpp}:events:v1
  OCPP_GATEWAY_AUTHORIZATION_STREAM: ${GATEWAY_REDIS_KEY_PREFIX:-vtsa:production:ocpp}:authorization-requests:v1
  INTEGRATION_EVENT_STREAM: ${INTEGRATION_EVENT_STREAM:-vtsa:production:platform:events:v1}

x-platform-service: &platform-service
  image: ghcr.io/kernelhubinc/vtsacsms/platform:${IMAGE_TAG:?IMAGE_TAG is required}
  environment: *platform-environment
  restart: unless-stopped
  networks: [application]
  logging: *json-logging

services:
  platform:
    <<: *platform-service

  web:
    image: ghcr.io/kernelhubinc/vtsacsms/web:${IMAGE_TAG:?IMAGE_TAG is required}
    depends_on:
      platform:
        condition: service_healthy
    ports:
      - "${APP_HTTP_BIND_ADDRESS:-0.0.0.0}:${APP_HTTP_PORT:-80}:8080"
    restart: unless-stopped
    networks: [application]
    logging: *json-logging

  worker:
    <<: *platform-service
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90", "--max-time=3600"]
    depends_on:
      platform:
        condition: service_healthy

  scheduler:
    <<: *platform-service
    profiles: [scheduler]
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      platform:
        condition: service_healthy

  ocpp-event-consumer:
    <<: *platform-service
    command: ["php", "artisan", "charging:consume-ocpp-events"]
    depends_on:
      platform:
        condition: service_healthy
      ocpp-gateway:
        condition: service_healthy

  ocpp-authorization-consumer:
    <<: *platform-service
    command: ["php", "artisan", "charging:consume-ocpp-authorizations"]
    depends_on:
      platform:
        condition: service_healthy
      ocpp-gateway:
        condition: service_healthy

  ocpp-gateway:
    image: ghcr.io/kernelhubinc/vtsacsms/ocpp-gateway:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 9000
      GATEWAY_LOG_LEVEL: INFO
      GATEWAY_ENVIRONMENT: ${DEPLOY_ENVIRONMENT:-production}
      GATEWAY_FORWARDED_ALLOW_IPS: "*"
      GATEWAY_REDIS_URL: ${GATEWAY_REDIS_URL:?GATEWAY_REDIS_URL is required}
      GATEWAY_REDIS_KEY_PREFIX: ${GATEWAY_REDIS_KEY_PREFIX:-vtsa:production:ocpp}
      GATEWAY_INTERNAL_API_TOKEN: ${GATEWAY_INTERNAL_API_TOKEN:?GATEWAY_INTERNAL_API_TOKEN is required}
      OCPP_CHARGER_REGISTRY_JSON: ${OCPP_CHARGER_REGISTRY_JSON:?OCPP_CHARGER_REGISTRY_JSON is required}
      OCPP_ALLOWED_COMMANDS: ${OCPP_ALLOWED_COMMANDS:-}
      OCPP_DATA_TRANSFER_ALLOWLIST: ${OCPP_DATA_TRANSFER_ALLOWLIST:-}
      OCPP_DEVELOPMENT_ALLOW_UNAUTHENTICATED: "false"
      OCPP_REQUIRE_TLS: "true"
      GATEWAY_RAW_MESSAGE_LOGGING: "true"
    ports:
      - "${OCPP_PUBLIC_BIND_ADDRESS:-0.0.0.0}:${OCPP_PUBLIC_PORT:-9000}:9000"
    depends_on: []
    stop_grace_period: 30s
    restart: unless-stopped
    networks: [application]
    logging: *json-logging

  db-tools:
    image: postgis/postgis:18-3.6
    profiles: [tools]
    environment:
      PGHOST: ${DB_HOST:?DB_HOST is required}
      PGPORT: ${DB_PORT:-5432}
      PGDATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      PGUSER: ${DB_USERNAME:?DB_USERNAME is required}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGSSLMODE: ${DB_SSLMODE:-require}
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    networks: [application]

networks:
  application:

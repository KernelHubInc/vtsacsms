  <text x="88" y="342" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="750">A clearer charging network.</text><text x="88" y="414" fill="#C8E0EA" font-family="Inter, Arial, sans-serif" font-size="29">Know the place. Read the signal. Keep moving.</text>

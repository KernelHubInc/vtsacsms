<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Find compatible EV chargers and follow charging sessions with Power Solutions.">
  <meta name="theme-color" content="#12366B">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Power Solutions</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <style>
    html, body {
      background: #f5f8fb;
      height: 100%;
      margin: 0;
    }

    .startup {
      align-items: center;
      background:
        radial-gradient(circle at 88% 12%, rgba(87, 221, 210, .28), transparent 32%),
        linear-gradient(145deg, #f5f8fb 0%, #eaf8f8 100%);
      color: #17243a;
      display: flex;
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      inset: 0;
      justify-content: center;
      padding: 32px;
      position: fixed;
    }

    .startup__content {
      max-width: 420px;
      text-align: center;
      width: 100%;
    }

    .startup__logo {
      align-items: center;
      display: flex;
      justify-content: center;
      margin: 0 auto 30px;
      width: min(280px, 76vw);
    }

    .startup__logo img {
      display: block;
      height: auto;
      width: 100%;
    }

    .startup h1 {
      font-size: 32px;
      letter-spacing: -0.035em;
      line-height: 1.1;
      margin: 0 0 10px;
    }

    .startup p {
      color: #66758a;
      margin: 0 0 26px;
    }

    .startup__bar {
      background: #d8e4ed;
      border-radius: 999px;
      height: 4px;
      overflow: hidden;
    }

    .startup::before,
    .startup::after {
      border: 8px solid rgba(69, 207, 199, .22);
      border-radius: 999px;
      content: "";
      height: 42vw;
      max-height: 280px;
      max-width: 620px;
      pointer-events: none;
      position: absolute;
      transform: rotate(-17deg);
      width: 88vw;
    }

    .startup::before {
      bottom: -18%;
      left: -18%;
    }

    .startup::after {
      border-color: rgba(37, 137, 190, .12);
      right: -28%;
      top: -18%;
    }

    .startup__bar::after {
      animation: startup-progress 1.2s ease-in-out infinite;
      background: #45cfc7;
      border-radius: inherit;
      content: "";
      display: block;
      height: 100%;
      width: 42%;
    }

    @keyframes startup-progress {
      from { transform: translateX(-110%); }
      to { transform: translateX(350%); }
    }

    @media (prefers-color-scheme: dark) {
      html, body { background: #07172c; }
      .startup {
        background:
          radial-gradient(circle at 88% 12%, rgba(87, 221, 210, .14), transparent 32%),
          linear-gradient(145deg, #07172c 0%, #0b2448 100%);
        color: #f5fbff;
      }
      .startup p { color: #b9cfdd; }
      .startup__bar { background: #27496f; }
    }
  </style>
</head>
<body>
  <noscript>JavaScript is required to use Power Solutions.</noscript>
  <div class="startup" id="flutter-startup" role="status" aria-live="polite">
    <div class="startup__content">
      <div class="startup__logo" aria-hidden="true"><img src="assets/assets/branding/power-solutions-logo-horizontal.png" alt=""></div>
      <h1>Starting Power Solutions</h1>
      <p id="flutter-startup-detail">Preparing the mobile experience.</p>
      <div class="startup__bar" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    (() => {
      const startup = document.getElementById('flutter-startup');
      const detail = document.getElementById('flutter-startup-detail');
      const removeStartup = () => startup?.remove();
      const observer = new MutationObserver(() => {
        if (document.querySelector('flutter-view')) {
          observer.disconnect();
          removeStartup();
        }
      });

      observer.observe(document.body, { childList: true });
      window.addEventListener('flutter-first-frame', removeStartup, { once: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
